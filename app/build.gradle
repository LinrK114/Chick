plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.customclickapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.customclickapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 这里不使用 AndroidX，只用系统 Activity，所以不需要额外依赖
}